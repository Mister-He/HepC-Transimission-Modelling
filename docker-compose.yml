services:
  test:
    build: .
    image: hepc-numpyro:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["python", "-m", "pytest", "tests/unit", "tests/integration", "-v"]

  infer:
    build: .
    image: hepc-numpyro:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
    command:
      - python
      - scripts/run_nuts.py
      - --num-warmup
      - "500"
      - --num-samples
      - "1000"
      - --num-chains
      - "4"
      - --dt-days
      - "7"
      - --out-dir
      - results/numpyro_nuts
