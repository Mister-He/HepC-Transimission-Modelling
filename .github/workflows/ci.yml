# =============================================================================
# ci.yml — CI for the HCV PWID compartmental model (R + Rcpp)
#
# Runs on every push / pull request:
#   r-tests            install R packages, compile scripts/model/sim.cpp, run
#                      tests/unit and tests/integration
#   python-syntax      syntax-check the Python figure and manuscript scripts
#
# Heavy compute (multi-start calibration, reference MCMC, scenarios) is
# intentionally NOT part of CI; see docs/training.md.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  r-tests:
    name: R unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libblas-dev liblapack-dev gfortran

      - name: Install R packages
        run: |
          install.packages(
            c("Rcpp", "RcppArmadillo", "dplyr", "ggplot2", "MASS", "patchwork", "jsonlite"),
            repos = "https://cloud.r-project.org", quiet = TRUE
          )
        shell: Rscript {0}

      - name: Compile check (scripts/model/sim.cpp)
        run: |
          Rcpp::sourceCpp("scripts/model/sim.cpp")
          cat("compile OK\n")
        shell: Rscript {0}

      - name: Unit tests
        run: Rscript scripts/run_tests.R --scope unit

      - name: Integration tests
        run: Rscript scripts/run_tests.R --scope integration

  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check scripts/*.py and scripts/paper/*.py
        run: python -m py_compile scripts/*.py scripts/paper/*.py
